name: "버그 제보 / Bug Report"
description: "오류 또는 예상과 다른 동작을 제보합니다. / Report a bug or unexpected behavior."
title: "[버그 / Bug] "
body:
  - type: markdown
    attributes:
      value: |
        버그 제보에 시간을 내주셔서 감사합니다.
        비밀번호, 토큰, 개인 키, 개인정보 또는 민감한 보안 세부 정보는 작성하지 마세요.

        Thank you for taking the time to report a bug.
        Do not include passwords, tokens, private keys, personal data, or sensitive security details.

  - type: input
    id: project
    attributes:
      label: "제품 또는 프로젝트명 / Product or project name"
      description: "어떤 SilverBell Choir 프로젝트와 관련된 문제인가요? / Which SilverBell Choir project does this affect?"
      placeholder: "예: 제품 또는 프로젝트명 / Example: product or project name"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "버전 또는 빌드 / Version or build"
      description: "알고 있다면 문제가 발생한 버전 또는 빌드를 입력해 주세요. / Enter the affected version or build if known."
      placeholder: "예: v1.0.0 / build 102"
    validations:
      required: false

  - type: dropdown
    id: environment_type
    attributes:
      label: "실행 환경 / Environment type"
      options:
        - "데스크톱 앱 / Desktop app"
        - "웹 앱 / Web app"
        - "모바일 앱 / Mobile app"
        - "API / 백엔드 / API / backend"
        - "문서 / Documentation"
        - "기타 또는 모름 / Other / not sure"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "문제 요약 / Bug summary"
      description: "문제를 간단히 설명해 주세요. / Briefly describe the problem."
      placeholder: "무엇이 잘못되었는지 간단히 작성해 주세요. / A short summary of what is going wrong"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "재현 절차 / Steps to reproduce"
      description: "문제를 재현할 수 있는 절차를 작성해 주세요. / List the steps needed to reproduce the issue."
      placeholder: |
        1. ...로 이동 / Go to ...
        2. ...를 실행 / Click or run ...
        3. 문제 확인 / See the issue ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "기대한 동작 / Expected behavior"
      placeholder: "어떻게 동작할 것으로 예상했나요? / What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "실제 동작 / Actual behavior"
      placeholder: "실제로는 어떻게 동작했나요? / What happened instead?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "로그, 스크린샷, 추가 정보 / Logs, screenshots, or extra context"
      description: "민감하지 않은 로그, 스크린샷 또는 추가 정보를 첨부해 주세요. / Add relevant non-sensitive logs, screenshots, or other context."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "확인 사항 / Checklist"
      options:
        - label: "민감한 보안 취약점 세부 정보가 포함되지 않았음을 확인했습니다. / I confirmed this report does not contain sensitive security disclosure details."
          required: true
        - label: "관련 제품 또는 프로젝트명을 작성했습니다. / I included the related product or project name."
          required: true
