name: 기능 요청 / Feature Request
description: 새로운 기능 또는 개선 아이디어를 제안합니다 / Suggest a new feature or improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        SilverBell Choir에 아이디어를 제안해 주셔서 감사합니다.
        Thank you for sharing an idea with SilverBell Choir.

  - type: input
    id: project
    attributes:
      label: 제품 또는 프로젝트명 / Product or project name
      description: 어떤 프로젝트에 대한 요청인가요? / Which project should this request apply to?
      placeholder: 관련 제품 또는 프로젝트명을 입력해 주세요 / Enter the related product or project name
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제 또는 필요 / Problem or need
      description: 어떤 문제를 해결하려는지 설명해 주세요 / What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법 / Proposed solution
      description: 원하는 기능이나 개선 방향을 설명해 주세요 / Describe the feature or improvement you would like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안 / Alternatives considered
      description: 다른 방법이나 현재 사용 중인 우회 방법이 있다면 적어 주세요 / Describe any alternatives or current workarounds
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: 사용 사례 또는 기대 효과 / Use case or expected impact
      description: 이 기능이 어떤 상황에서 어떻게 도움이 되는지 적어 주세요 / Explain how this feature would help and in what situations
    validations:
      required: false
