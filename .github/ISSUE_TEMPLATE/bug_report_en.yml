name: Bug Report (English)
description: Report a bug or unexpected behavior
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include passwords, tokens, private keys, or sensitive security details.

  - type: input
    id: project
    attributes:
      label: Product or project name
      description: Which SilverBell Choir project does this affect?
      placeholder: Enter the product or project name
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or build
      description: Enter the affected version or build if known
      placeholder: Example: v1.0.0 / build 102
    validations:
      required: false

  - type: dropdown
    id: environment_type
    attributes:
      label: Environment
      options:
        - Desktop app
        - Web app
        - Mobile app
        - API / backend
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Briefly describe the problem
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or extra context
      description: Add non-sensitive logs, screenshots, or other context if available
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I confirmed this report does not contain sensitive security details.
          required: true
        - label: I included the related product or project name.
          required: true
