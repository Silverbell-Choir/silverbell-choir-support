name: 💬 일반 지원 / General Support
description: 사용 문의·설정·일반적인 도움 / Usage, setup, or general help
title: "[Support] "
body:
  - type: markdown
    attributes:
      value: |
        일반 문의나 도움이 필요한 경우 이 양식을 이용해 주세요.
        Use this form for general questions or help requests.

  - type: input
    id: project
    attributes:
      label: 제품 또는 프로젝트명 / Product or project name
      description: 어떤 프로젝트에 대한 문의인가요? / Which project is this about?
      placeholder: 관련 프로젝트명 또는 Organization을 입력해 주세요 / Enter the related project name or Organization
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 어떤 도움이 필요한가요? / What do you need help with?
      description: 질문이나 지원이 필요한 내용을 설명해 주세요 / Describe your question or support need
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 추가 정보 / Additional context
      description: 상황을 이해하는 데 도움이 될 추가 정보가 있다면 작성해 주세요 / Add any extra information that would help us understand the situation
    validations:
      required: false
